{% extends 'base.html' %}
{% block content %}
<main>

    <div class="recipeContainer">
        <div class="recipe-results"></div>
    </div>
    <div id="recipeModal" class="recipeModal">
        <span class="close-btn">×</span>
        <h2 id="recipeTitle"></h2>
        <img id="recipeImage" alt="Recipe Image">
        <ul id="recipeIngredients"></ul>
        <p id="recipeInstructions"></p>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<style>
    .search-header {
        text-align: center;
        padding: 20px;
        background: #161616;
        color: #f9f9f9;
    }

    .search-header h1 {
        margin-bottom: 20px;
        font-size: 40px;
        text-shadow: 0 0 7px #f0d23d;
    }

    .search-bar {
        position: relative;
        display: flex;
        align-items: center;
        background: #f0d23d;
        border-radius: 25px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        height: 35px;
        padding: 10px;
        width: 370px;
        margin: 0 auto;
    }

    .search-bar input {
        flex: 1;
        padding: 10px 40px 10px 15px;
        border: none;
        outline: none;
        font-size: 16px;
        background: #ffffff;
        border-radius: 25px 0 0 25px;
        color: #333;
    }

    .search-bar input::placeholder {
        color: #999;
    }

    .search-bar button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
    }

    .search-bar i.fas {
        font-size: 22px;
        color: #333;
    }

    .recipeContainer {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
        background: #f9f9f9;
    }

    .recipe-results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 1200px;
    }

    .recipe-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.3s;
    }

    .recipe-card:hover {
        transform: translateY(-5px);
    }

    .recipe-card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
    }

    .recipe-card h3 {
        margin: 10px;
        font-size: 18px;
        color: #333;
    }

    .recipeModal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .recipeModal-content {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        max-width: 600px;
        width: 90%;
        position: relative;
    }

    .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 24px;
        cursor: pointer;
        color: #333;
    }

    .recipeModal img {
        max-width: 100%;
        height: auto;
        border-radius: 5px;
    }

    .recipeModal ul {
        margin: 10px 0;
        padding-left: 20px;
        color: #333;
    }

    .recipeModal p {
        margin: 10px 0;
        color: #333;
    }

    .error-message {
        color: red;
        text-align: center;
        margin: 20px;
        font-size: 18px;
    }
</style>

<script>
    // Fetch recipes on page load
    const ingredients = "{{ ingredients | safe }}";
    if (ingredients) {
        fetchRecipes(ingredients);
    }

    // Search button handler
    document.getElementById('searchButton').addEventListener('click', function () {
        const input = document.getElementById('ingredientInput').value.trim();
        if (!input) {
            displayError('Please enter at least one ingredient');
            return;
        }
        fetchRecipes(input);
    });

    function fetchRecipes(ingredients) {
        fetch('/search_recipes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: 'ingredients=' + encodeURIComponent(ingredients)
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    displayError(data.error);
                } else {
                    displayRecipes(data.recipes);
                }
            })
            .catch(error => {
                displayError('An error occurred while fetching recipes');
                console.error(error);
            });
    }

    function displayError(message) {
        const resultsContainer = document.querySelector('.recipe-results');
        resultsContainer.innerHTML = `<p class="error-message">${message}</p>`;
    }

    function displayRecipes(recipes) {
        const resultsContainer = document.querySelector('.recipe-results');
        resultsContainer.innerHTML = '';

    }

</script>
{% endblock %}
